[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-ip-scanner"
version = "1.0.0"
description = "A terminal-styled IP geolocation lookup tool."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
terminal-ip-scanner = "scanner.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["scanner*"]
